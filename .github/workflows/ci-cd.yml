name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # Job 1: Build, Lint, Test, & Docker Push
  # ==========================================
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & App Dependencies
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: Run Client Linter
        run: |
          cd client
          npm run lint

      - name: Run Server Test Suite
        run: |
          cd server
          npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ai-growth-server:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/ai-growth-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ai-growth-client:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/ai-growth-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Zero-Downtime Deployment to EC2
  # ==========================================
  cd:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Deployment Configs to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "deploy/*"
          target: "/home/${{ secrets.AWS_EC2_USER }}/aigrowthexa"
          strip_components: 1

      - name: SSH to EC2 & Execute Blue-Green Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DOCKER_HUB_USERNAME,IMAGE_TAG,MONGO_URI,JWT_SECRET,EMAIL_USER,EMAIL_PASS,RESEND_API_KEY,EMAIL_FROM,GOOGLE_CLIENT_ID
        # We pass local GitHub environment variables into SSH context
        # and write them to a local host-level .env file.
        # This keeps secrets off Docker Hub and secure on the VM.
        # Note: we use github.sha as the image tag to pull the exact build.
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        script: |
          cd /home/${{ secrets.AWS_EC2_USER }}/aigrowthexa
          
          # Securely create host-level environment configuration file
          echo "Writing secrets file..."
          cat <<EOF > .env
          DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME}
          IMAGE_TAG=${IMAGE_TAG}
          MONGO_URI=${MONGO_URI}
          JWT_SECRET=${JWT_SECRET}
          EMAIL_USER=${EMAIL_USER}
          EMAIL_PASS=${EMAIL_PASS}
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=${EMAIL_FROM}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          EOF
          
          chmod 600 .env
          chmod +x deploy.sh rollback.sh
          
          echo "Triggering deploy.sh script..."
          ./deploy.sh
